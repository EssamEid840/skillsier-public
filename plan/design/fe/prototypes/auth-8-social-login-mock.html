<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen flex items-center justify-center">

    <!-- Mock Google Sign In Window -->
    <div
        class="bg-white w-full max-w-[450px] rounded-lg shadow-lg p-8 md:p-12 flex flex-col items-center border border-gray-200">

        <!-- Google Logo -->
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-12 h-12 mb-4">

        <h1 class="text-2xl font-medium text-gray-800 mb-2">Sign in with Google</h1>

        <div class="text-base text-gray-600 mb-8 text-center">
            to continue to <span class="font-medium text-gray-800">Skillsier</span>
        </div>

        <!-- User Account Selection -->
        <a href="onb-1-welcome.html"
            class="w-full flex items-center gap-4 p-3 rounded-md hover:bg-gray-50 border border-gray-200 cursor-pointer transition-colors mb-2 group">
            <div
                class="w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center text-lg font-medium">
                J
            </div>
            <div class="flex-1 text-left">
                <div class="text-sm font-medium text-gray-800 group-hover:text-black">Jane Doe</div>
                <div class="text-xs text-gray-500">jane.doe@example.com</div>
            </div>
        </a>

        <div
            class="w-full flex items-center gap-4 p-3 rounded-md hover:bg-gray-50 border-t border-x border-b border-transparent hover:border-gray-200 cursor-pointer transition-colors mb-8">
            <div class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <div class="flex-1 text-left">
                <div class="text-sm font-medium text-gray-800">Use another account</div>
            </div>
        </div>

        <div class="text-xs text-gray-500 text-center max-w-xs leading-relaxed">
            To continue, Google will share your name, email address, and language preference with Skillsier.
        </div>

        <div class="mt-8 flex gap-4 w-full">
            <!-- Cancel goes back to history or login -->
            <button onclick="history.back()"
                class="flex-1 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 rounded transition-colors">
                Cancel
            </button>
            <!-- Continue goes to onboarding -->
            <button onclick="handleSocialLogin()"
                class="flex-1 py-2 bg-blue-600 text-white text-sm font-medium rounded hover:bg-blue-700 transition-colors text-center flex items-center justify-center gap-2">
                <span id="btn-text">Continue</span>
                <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg"
                    fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
            </button>
        </div>

        <!-- Error Message -->
        <div id="error-msg"
            class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm w-full text-center">
            Unable to sign in. Please try again.
        </div>

        <!-- Simulation Controls -->
        <div class="mt-8 pt-4 border-t border-gray-100 w-full text-center">
            <button onclick="toggleErrorMode()" id="error-toggle"
                class="text-xs text-gray-400 hover:text-gray-600 underline">
                Simulate Error: Off
            </button>
        </div>

        <script>
            let errorMode = false;

            function toggleErrorMode() {
                errorMode = !errorMode;
                document.getElementById('error-toggle').innerText = `Simulate Error: ${errorMode ? 'On' : 'Off'}`;
            }

            function handleSocialLogin() {
                const btn = document.querySelector('button[onclick="handleSocialLogin()"]');
                const spinner = document.getElementById('btn-spinner');
                const text = document.getElementById('btn-text');
                const errorMsg = document.getElementById('error-msg');

                // Reset
                errorMsg.classList.add('hidden');
                btn.disabled = true;
                spinner.classList.remove('hidden');
                text.innerText = 'Signing in...';

                setTimeout(() => {
                    if (errorMode) {
                        errorMsg.classList.remove('hidden');
                        btn.disabled = false;
                        spinner.classList.add('hidden');
                        text.innerText = 'Continue';
                    } else {
                        window.location.href = 'onb-1-welcome.html';
                    }
                }, 1500);
            }
        </script>

    </div>

</body>

</html>
