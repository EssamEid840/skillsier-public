apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: keycloak
  annotations:
    # ===== cert-manager (use DNS-01 ClusterIssuer you already have) =====
    cert-manager.io/cluster-issuer: letsencrypt   # << add this

    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/add-headers: "ingress-nginx/keycloak-security-headers"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - keycloak.skillsier.com
      secretName: keycloak-tls    # cert-manager will (re)create/populate this
  rules:
    - host: keycloak.skillsier.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
