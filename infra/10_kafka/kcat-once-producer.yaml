apiVersion: v1
kind: Pod
metadata:
  name: kcat-once-producer
  namespace: kafka
  labels: { app: kcat }
spec:
  restartPolicy: Never
  volumes:
    - name: ca
      secret:
        secretName: kafka-cluster-cluster-ca-cert
        items: [{ key: ca.crt, path: ca.crt }]
    - name: creds
      secret:
        secretName: admin-user
        items: [{ key: password, path: password }]
  containers:
    - name: kcat
      image: edenhill/kcat:1.7.1
      command: ["/bin/sh","-ec"]
      args:
        - |
          PW="$(tr -d '\r\n' </creds/password)"
          printf '%s\n' '{"event":"ok","ts":"'"$(date -Iseconds)"'"}' |
          kcat -P \
            -b kafka-cluster-kafka-bootstrap.kafka.svc:9094 \
            -X security.protocol=SASL_SSL \
            -X sasl.mechanisms=SCRAM-SHA-512 \
            -X sasl.username=admin-user \
            -X sasl.password="$PW" \
            -X ssl.ca.location=/tls/ca.crt \
            -t keycloak-events -l
      volumeMounts:
        - { name: ca,    mountPath: /tls,   readOnly: true }
        - { name: creds, mountPath: /creds, readOnly: true }
