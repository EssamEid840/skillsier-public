apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        class: local-path
        kraftMetadata: shared
  resources:
    requests: { memory: 512Mi, cpu: 100m }
    limits:   { memory: 1Gi,   cpu: 500m }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration: { useServiceDnsDomain: true }
      - name: tls
        port: 9093
        type: internal
        tls: true
        configuration: { useServiceDnsDomain: true }
      - name: sasl
        port: 9094
        type: internal
        tls: true
        authentication: { type: scram-sha-512 }
        configuration: { useServiceDnsDomain: true }
      - name: external
        port: 9095
        type: nodeport
        tls: true
        authentication: { type: scram-sha-512 }
        configuration:
          bootstrap:
            nodePort: 31691  # Lock this port
            alternativeNames:
              - 173.212.218.251
          brokers:
            - broker: 0
              advertisedHost: 173.212.218.251
              advertisedPort: 32605  # Use the current broker port
              nodePort: 32605  # Lock this port
    authorization:
      type: simple
      superUsers:
        - CN=strimzi-cluster-operator
        - keycloak-user
        - admin-user

    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: true
      num.partitions: 1
      compression.type: snappy
      log.retention.hours: 168
      log.segment.bytes: 536870912
      log.retention.check.interval.ms: 300000
      socket.send.buffer.bytes: 65536
      socket.receive.buffer.bytes: 65536
      socket.request.max.bytes: 52428800
      group.initial.rebalance.delay.ms: 3000
      replica.lag.time.max.ms: 30000

    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

    jvmOptions:
      -Xms: "512m"
      -Xmx: "768m"
      javaSystemProperties:
        - name: java.net.preferIPv4Stack
          value: "true"

    template:
      pod:
        securityContext:
          runAsUser: 1000
          fsGroup: 1000

  entityOperator:
    topicOperator:
      # Slightly relaxed probes to avoid early restarts on small nodes
      livenessProbe:
        initialDelaySeconds: 40
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 18
      resources:
        requests:
          memory: 128Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 200m
    userOperator:
      # This is the one that was CrashLooping; give it more time
      livenessProbe:
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      readinessProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 18
      resources:
        requests:
          memory: 256Mi
          cpu: 150m
        limits:
          memory: 384Mi
          cpu: 300m

  kafkaExporter:
    groupRegex: "keycloak-.*"
    topicRegex: "keycloak-.*"
    resources:
      requests:
        memory: 64Mi
        cpu: 25m
      limits:
        memory: 128Mi
        cpu: 100m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: kafka
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          topic: "$4"
          partition: "$5"
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          broker: "$4:$5"