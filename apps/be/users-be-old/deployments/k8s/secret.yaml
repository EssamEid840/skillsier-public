# This is a template - replace values before applying
# In production, use sealed secrets or external secret management
apiVersion: v1
kind: Secret
metadata:
  name: kafka-admin-credentials
  namespace: skillsier
type: Opaque
stringData:
  username: admin-user
  password: "YOUR_KAFKA_PASSWORD_HERE"  # Get from: kubectl get secret admin-user -n kafka -o jsonpath='{.data.password}' | base64 -d
---
