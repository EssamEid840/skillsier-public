apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: users-be-postgres-allow-app
  namespace: skillsier
spec:
  podSelector:
    matchLabels:
      app: users-be-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {} # allow in-namespace pods (tighten later)
      ports:
        - protocol: TCP
          port: 5432
