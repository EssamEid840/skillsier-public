syntax = "proto3";

package skillsier.common.v1;

option go_package = "skillsier.dev/contracts/events/gen/go/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

// EventEnvelope wraps all events for Kafka publishing
// This is the standard envelope used for all event publishing
message EventEnvelope {
  // Kafka topic name (e.g., "user.created", "job.posted")
  string topic = 1;
  
  // Partition key - usually the entity ID (user_id, job_id, contract_id, etc.)
  // Ensures all events for the same entity go to the same partition
  string key = 2;
  
  // Timestamp when the event was published to Kafka
  google.protobuf.Timestamp published_at = 3;
  
  // Additional metadata headers (correlation IDs, trace IDs, etc.)
  map<string, string> headers = 4;
  
  // The actual event payload (serialized protobuf)
  bytes payload = 5;
  
  // Schema version of the event (e.g., "v1.0.0")
  string schema_version = 6;
  
  // Content type - always "application/protobuf" for our events
  string content_type = 7;
  
  // Tenant ID for multi-tenant support (optional)
  string tenant_id = 8;
  
  // Environment where the event was generated (dev, staging, prod)
  string environment = 9;
}

// UserContext provides information about the user who triggered the event
// This is included in EVERY event for audit trail and debugging
message UserContext {
  // User ID who triggered the event
  string user_id = 1;
  
  // Username at the time of the event
  string username = 2;
  
  // IP address of the user
  string ip_address = 3;
  
  // User agent (browser/app information)
  string user_agent = 4;
  
  // Session ID for tracking user sessions
  string session_id = 5;
  
  // Device ID (for mobile apps or persistent browser tracking)
  string device_id = 6;
  
  // Geographic location (city, country or lat/lng)
  string geo_location = 7;
  
  // User's timezone at time of event
  string timezone = 8;
  
  // User's locale/language preference
  string locale = 9;
  
  // Platform used (web, ios, android, api)
  string platform = 10;
  
  // App version (for mobile apps)
  string app_version = 11;
}

// ComplianceContext ensures GDPR, CCPA, and other regulatory compliance
// This is included in EVERY event for legal and compliance purposes
message ComplianceContext {
  // Indicates if this event is GDPR compliant
  bool gdpr_compliant = 1;
  
  // Indicates if this event is CCPA compliant
  bool ccpa_compliant = 2;
  
  // Data retention policy applied to this event
  // Examples: "90_days", "7_years", "indefinite"
  string data_retention_policy = 3;
  
  // User consent flags at time of event
  ConsentFlags consent_flags = 4;
  
  // Right to be forgotten - if true, PII should be anonymized
  bool anonymization_required = 5;
  
  // Data processing legal basis (consent, contract, legitimate_interest, etc.)
  string legal_basis = 6;
  
  // Data controller information
  string data_controller = 7;
  
  // Data processor information (if different from controller)
  string data_processor = 8;
  
  // Countries where data is stored/processed
  repeated string data_locations = 9;
}

// ConsentFlags tracks user consent for various data processing activities
message ConsentFlags {
  // User consented to marketing communications
  bool marketing_consent = 1;
  
  // User consented to analytics/tracking
  bool analytics_consent = 2;
  
  // User consented to third-party data sharing
  bool third_party_sharing_consent = 3;
  
  // User consented to personalization
  bool personalization_consent = 4;
  
  // Timestamp when consent was given
  google.protobuf.Timestamp consent_timestamp = 5;
  
  // Version of terms/privacy policy consented to
  string consent_version = 6;
}

// AuditMetadata provides audit trail information for every event
// This is included in EVERY event for compliance and debugging
message AuditMetadata {
  // Who triggered the event (user ID, "system", "admin:user_id", "cron:job_name")
  string triggered_by = 1;
  
  // Human-readable reason for the change or event
  string change_reason = 2;
  
  // Type of trigger (user_action, system_event, admin_action, scheduled_job, webhook)
  string trigger_type = 3;
  
  // Service/component that generated the event
  string source_service = 4;
  
  // Source service version
  string source_service_version = 5;
  
  // Request ID for HTTP requests
  string request_id = 6;
  
  // Transaction ID for database transactions
  string transaction_id = 7;
  
  // Previous state (for update events) - JSON encoded
  string previous_state = 8;
  
  // Changed fields (for update events)
  repeated string changed_fields = 9;
  
  // Additional audit notes
  string audit_notes = 10;
  
  // Impersonation info (if admin is acting as another user)
  ImpersonationInfo impersonation = 11;
}

// ImpersonationInfo tracks when an admin is acting as another user
message ImpersonationInfo {
  // Admin user ID performing the impersonation
  string admin_user_id = 1;
  
  // Admin username
  string admin_username = 2;
  
  // User being impersonated
  string impersonated_user_id = 3;
  
  // Reason for impersonation
  string reason = 4;
  
  // Impersonation session ID
  string session_id = 5;
  
  // When impersonation started
  google.protobuf.Timestamp started_at = 6;
}

// BaseEventMetadata contains fields that MUST be present in every event
// This ensures consistent event structure across the entire platform
message BaseEventMetadata {
  // Unique identifier for this event instance (UUID)
  // Used for deduplication and idempotency
  string event_id = 1;
  
  // When the event occurred (not when it was published)
  google.protobuf.Timestamp event_timestamp = 2;
  
  // ID of the primary entity this event relates to
  // For UserCreated: user_id
  // For JobPosted: job_id
  // For PaymentProcessed: transaction_id
  string aggregate_id = 3;
  
  // Schema version number (e.g., 1, 2, 3)
  // Increment on breaking changes
  int32 event_version = 4;
  
  // Service that published the event (e.g., "users-be", "jobs-be")
  string event_source = 5;
  
  // Correlation ID for tracing related events across services
  // All events in a business transaction share the same correlation_id
  string correlation_id = 6;
  
  // The event_id that caused this event (for event chains)
  // Empty if this is the initial event in a chain
  string causation_id = 7;
  
  // User context - who triggered this event
  UserContext user_context = 8;
  
  // Compliance context - regulatory compliance info
  ComplianceContext compliance_context = 9;
  
  // Audit metadata - audit trail information
  AuditMetadata audit_metadata = 10;
  
  // Event type name (e.g., "UserCreated", "JobPosted")
  // Useful for polymorphic event handling
  string event_type = 11;
  
  // Event category (user, job, contract, payment, etc.)
  string event_category = 12;
  
  // Event tags for filtering and routing
  repeated string tags = 13;
  
  // Idempotency key - ensures exactly-once processing
  string idempotency_key = 14;
  
  // Retry count (for failed event processing)
  int32 retry_count = 15;
  
  // Original event timestamp (for retries)
  google.protobuf.Timestamp original_timestamp = 16;
  
  // Time-to-live for the event (seconds)
  // Events older than this can be ignored by consumers
  int32 ttl_seconds = 17;
  
  // Priority level for event processing
  EventPriority priority = 18;
  
  // Whether this is a test event (for development/testing)
  bool is_test_event = 19;
  
  // Custom metadata - service-specific fields
  map<string, string> custom_metadata = 20;
}

// EventPriority indicates the importance of event processing
enum EventPriority {
  EVENT_PRIORITY_UNSPECIFIED = 0;
  EVENT_PRIORITY_LOW = 1;          // Can be processed with delay
  EVENT_PRIORITY_NORMAL = 2;       // Standard priority
  EVENT_PRIORITY_HIGH = 3;         // Should be processed quickly
  EVENT_PRIORITY_CRITICAL = 4;     // Must be processed immediately
  EVENT_PRIORITY_REALTIME = 5;     // Real-time processing required
}

// EventStatus tracks the lifecycle of event processing
enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_PENDING = 1;        // Event created, waiting to be published
  EVENT_STATUS_PUBLISHED = 2;      // Event published to message broker
  EVENT_STATUS_DELIVERED = 3;      // Event delivered to at least one consumer
  EVENT_STATUS_PROCESSED = 4;      // Event successfully processed by all consumers
  EVENT_STATUS_FAILED = 5;         // Event processing failed
  EVENT_STATUS_DEAD_LETTER = 6;    // Event moved to dead letter queue
  EVENT_STATUS_EXPIRED = 7;        // Event TTL expired
  EVENT_STATUS_DUPLICATE = 8;      // Duplicate event detected (idempotency)
}

// RetryPolicy defines how failed events should be retried
message RetryPolicy {
  // Maximum number of retry attempts
  int32 max_retries = 1;
  
  // Initial retry delay in seconds
  int32 initial_delay_seconds = 2;
  
  // Maximum retry delay in seconds (with exponential backoff)
  int32 max_delay_seconds = 3;
  
  // Backoff multiplier (e.g., 2.0 for doubling delay each retry)
  double backoff_multiplier = 4;
  
  // Whether to use exponential backoff
  bool exponential_backoff = 5;
  
  // Whether to add jitter to retry delays
  bool add_jitter = 6;
  
  // Dead letter queue topic name (if max retries exceeded)
  string dead_letter_topic = 7;
}

// EventMetrics captures performance metrics for event processing
message EventMetrics {
  // Time taken to publish the event (milliseconds)
  int32 publish_duration_ms = 1;
  
  // Size of the serialized event (bytes)
  int32 event_size_bytes = 2;
  
  // Number of consumers that processed this event
  int32 consumer_count = 3;
  
  // Average processing time across all consumers (milliseconds)
  int32 avg_processing_time_ms = 4;
  
  // Maximum processing time among all consumers (milliseconds)
  int32 max_processing_time_ms = 5;
  
  // Whether the event was compressed
  bool compressed = 6;
  
  // Compression ratio (if compressed)
  double compression_ratio = 7;
  
  // Network latency (milliseconds)
  int32 network_latency_ms = 8;
}