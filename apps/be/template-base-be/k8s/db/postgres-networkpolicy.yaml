apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: <service>-be-postgres-allow-app
  namespace: <k8s_namespace>
  labels:
    app: <service>-be-postgres
spec:
  podSelector:
    matchLabels:
      app: <service>-be-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432