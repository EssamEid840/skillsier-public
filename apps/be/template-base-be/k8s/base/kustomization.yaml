apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: <k8s_namespace>

commonLabels:
  app: <service>-be
  managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml

configMapGenerator:
  - name: <service>-be-config
    files:
      - config.properties

images:
  - name: <docker_image>
    newTag: latest

replicas:
  - name: <service>-be
    count: 2