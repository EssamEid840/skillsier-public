apiVersion: v1
kind: Secret
metadata:
  name: <service>-be-postgres
  namespace: <k8s_namespace>
  labels:
    app: <service>-be
    component: database
type: Opaque
stringData:
  POSTGRES_USER: "<db_user>"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  POSTGRES_DB: "<db_name>"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-client-<service>-be
  namespace: keycloak
  labels:
    app: <service>-be
    component: auth
type: Opaque
stringData:
  client-id: "<service>-be"
  client-secret: "CHANGE_ME_IN_PRODUCTION"
---
# Note: kafka-admin-credentials should already exist in kafka namespace
# Created by Kafka installation. This is just a reference.
# 
# To get the password:
#   kubectl get secret admin-user -n kafka -o jsonpath='{.data.password}' | base64 -d
