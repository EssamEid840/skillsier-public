version: "3.9"
services:
  postgres:
    image: postgres:17
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v23.3.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
    depends_on:
      - redpanda

  connect:
    image: quay.io/debezium/connect:2.6
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      - redpanda

  connect-init:
    image: curlimages/curl:8.7.1
    depends_on:
      - connect
    volumes:
      - ./deploy/connect/pg-outbox.json:/config/pg-outbox.json:ro
    command: >
      sh -c '
      set -e;
      CONNECT_URL=http://connect:8083;
      NAME=pg-outbox;
      CFG=/config/pg-outbox.json;

      echo "Waiting for Kafka Connect at $$CONNECT_URL ...";
      until curl -fsS "$$CONNECT_URL/"; do sleep 2; done;

      if curl -fsS "$$CONNECT_URL/connectors/$$NAME" >/dev/null 2>&1; then
        echo "Deleting existing connector $$NAME";
        curl -fsS -X DELETE "$$CONNECT_URL/connectors/$$NAME";
        while curl -fsS "$$CONNECT_URL/connectors/$$NAME" >/dev/null 2>&1; do sleep 1; done;
      fi

      echo "Creating connector $$NAME";
      curl -fsS -X POST "$$CONNECT_URL/connectors" \
        -H "Content-Type: application/json" \
        --data-binary "@$$CFG";

      echo "Connector $$NAME registered."
      '

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_USERNAME: user
      KC_DB_PASSWORD: pass
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak

      # Kafka connection for the playa provider
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092         # maps to kafka.bootstrap.servers

      # Topics (rename to your taste)
      KEYCLOAK_KAFKA_TOPIC_LOGIN: keycloak.realm-events
      KEYCLOAK_KAFKA_TOPIC_ADMIN: keycloak.admin-events

      # Optional (defaults shown in README)
      # KEYCLOAK_KAFKA_SYNC: "false"
      # KEYCLOAK_KAFKA_THROW_EXCEPTION_ON_ERROR: "false"

      # (optional) more logs from the plugin
      KC_LOG_LEVEL: INFO,ru.playa.keycloak.kafka:DEBUG,org.keycloak.events:DEBUG
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/providers:/opt/keycloak/providers
      - ./deploy/keycloak/conf/keycloak-kafka.properties:/opt/keycloak/conf/keycloak-kafka.properties:ro
    depends_on:
      postgres:
        condition: service_started
      redpanda:
        condition: service_started



volumes:
  pgdata:
  kcdata:




















