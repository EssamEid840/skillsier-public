apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: skillsier
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.skillsier.svc.cluster.local:6379"
    - name: redisPassword
      secretKeyRef:
        name: redis-secret
        key: password
scopes:
  - users-be