apiVersion: v1
kind: ConfigMap
metadata:
  name: users-be-config
  namespace: skillsier
  labels:
    app: users-be
    component: backend
data:
  # Application configuration
  app.name: "users-be"
  app.environment: "production"
  app.port: "8080"
  app.log_level: "info"
  
  # Database configuration (non-sensitive)
  database.host: "users-be-postgres.skillsier.svc.cluster.local"
  database.port: "5432"
  database.ssl_mode: "disable"
  database.max_open_conns: "25"
  database.max_idle_conns: "5"
  database.conn_max_lifetime: "30"
  database.auto_migrate: "false"
  database.allow_in_production: "false"
  
  # Kafka configuration (non-sensitive)
  kafka.brokers: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  kafka.security_protocol: "SASL_SSL"
  kafka.sasl_mechanism: "SCRAM-SHA-512"
  kafka.tls_skip_verify: "false"
  kafka.consumer_group: "users-be-group"
  kafka.topic_prefix: "users"
  
  # Kafka producer settings
  kafka.producer.required_acks: "-1"
  kafka.producer.max_message_bytes: "1000000"
  kafka.producer.compression: "snappy"
  kafka.producer.idempotent_writes: "true"
  kafka.producer.max_retries: "5"
  kafka.producer.retry_backoff: "100ms"
  
  # Kafka consumer settings
  kafka.consumer.enable_auto_commit: "false"
  kafka.consumer.auto_commit_interval: "1s"
  kafka.consumer.session_timeout: "10s"
  kafka.consumer.fetch_min_bytes: "1"
  kafka.consumer.fetch_max_wait: "500ms"
  kafka.consumer.max_processing_time: "30s"
  
  # Keycloak configuration (non-sensitive)
  keycloak.url: "http://keycloak.keycloak.svc.cluster.local:8080"
  keycloak.realm: "skillsier"
  keycloak.timeout: "10s"
  keycloak.jwks_cache_ttl: "24h"
  
  # Dapr configuration
  dapr.enabled: "true"
  dapr.http_port: "3500"
  dapr.grpc_port: "50001"
  dapr.pubsub_name: "kafka-pubsub"
  dapr.state_store_name: "statestore"
  
  # Outbox configuration
  outbox.enabled: "true"
  outbox.poll_interval: "5s"
  outbox.batch_size: "100"
  outbox.max_retries: "5"
  outbox.retry_backoff: "5s"