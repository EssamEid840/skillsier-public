apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: skillsier

commonLabels:
  app: users-be
  managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml

configMapGenerator:
  - name: users-be-config
    files:
      - config.properties

images:
  - name: skillsier/users-be:latest
    newTag: latest

replicas:
  - name: users-be
    count: 2