name: Mobile EAS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  eas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install
        run: pnpm install

      # EAS steps will be added after mobile app exists
      - name: Placeholder
        run: echo "Mobile EAS pipeline will be configured in later phase."
