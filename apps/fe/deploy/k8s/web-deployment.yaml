# k8s/web-deployment.yaml
# Kubernetes deployment for Skillsier Web Frontend

apiVersion: v1
kind: ConfigMap
metadata:
  name: web-fe-config
  namespace: default
data:
  NEXT_PUBLIC_API_URL: "http://users-be-service:8080/api"
  NEXT_PUBLIC_KEYCLOAK_URL: "https://keycloak.skillsier.com"
  NEXT_PUBLIC_KEYCLOAK_REALM: "skillsier"
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "skillsier-fe"
  KEYCLOAK_ISSUER_URL: "https://keycloak.skillsier.com/realms/skillsier"
  KEYCLOAK_MGMT_CLIENT_ID: "skillsier-bff"
  NEXT_PUBLIC_APP_URL: "https://skillsier.com"
  NODE_ENV: "production"

---
apiVersion: v1
kind: Secret
metadata:
  name: web-fe-secrets
  namespace: default
type: Opaque
stringData:
  KEYCLOAK_CLIENT_SECRET: "your-client-secret-here"
  KEYCLOAK_MGMT_CLIENT_SECRET: "your-mgmt-client-secret-here"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-fe
  namespace: default
  labels:
    app: web-fe
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-fe
  template:
    metadata:
      labels:
        app: web-fe
        tier: frontend
    spec:
      containers:
      - name: web-fe
        image: skillsier/web-fe:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        envFrom:
        - configMapRef:
            name: web-fe-config
        - secretRef:
            name: web-fe-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: web-fe-service
  namespace: default
  labels:
    app: web-fe
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: web-fe

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-fe-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - skillsier.com
    - www.skillsier.com
    secretName: web-fe-tls
  rules:
  - host: skillsier.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-fe-service
            port:
              number: 80
  - host: www.skillsier.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-fe-service
            port:
              number: 80